version: '3.8'

services:
  database:
    image: docker.io/library/postgres:15.19
    container_name: database
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: mainserver
    restart: always
    env_file:
      - .env
    depends_on:
      - database
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
